name: Arabic localization check
on:
  push:
    paths:
      - 'Resources/Locale/**'
      - 'Resources/Fonts/**'
      - 'Scripts/Classes/Singletons/ArabicRTL.gd'
      - 'Scripts/Classes/Singletons/Global.gd'
      - 'Scripts/Classes/Singletons/SettingsManager.gd'
      - 'Scripts/UI/WindowChanger.gd'
      - 'project.godot'
  pull_request:
    paths:
      - 'Resources/Locale/**'
      - 'Resources/Fonts/**'
      - 'Scripts/Classes/Singletons/ArabicRTL.gd'
      - 'Scripts/Classes/Singletons/Global.gd'
      - 'Scripts/Classes/Singletons/SettingsManager.gd'
      - 'Scripts/UI/WindowChanger.gd'
      - 'project.godot'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot headless
        run: |
          curl -fL -o godot.zip "https://downloads.tuxfamily.org/godotengine/4.5.1/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

      - name: Validate Arabic coverage and CSV shape
        run: godot --headless --path . --script tests/validate_localization.gd

      - name: Import project and compile translations
        run: godot --headless --editor --path . --quit --verbose
