name: Android APK export (Arabic)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  GODOT_TAG: 4.5.1-stable
  GODOT_DIR_VERSION: 4.5.1.stable

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot + export templates (official godot-builds releases)
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"
          curl -fL --retry 3 -o godot.zip "$base/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_DIR_VERSION}
          ls ~/.local/share/godot/export_templates/${GODOT_DIR_VERSION} | head

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Create debug keystore + Godot editor settings
        run: |
          keytool -genkey -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres

      - name: Align Android build template version with Godot
        run: echo -n "${GODOT_DIR_VERSION}" > android/.build_version

      - name: Import project
        run: godot --headless --editor --path . --quit || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" "$PWD/build/SMB1R-Arabic-debug.apk"
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: SMB1R-Arabic-android-debug-apk
          path: build/SMB1R-Arabic-debug.apk
          if-no-files-found: error
