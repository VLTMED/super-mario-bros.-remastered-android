name: Android APK export (Arabic)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  GODOT_TAG: 4.5.1-stable
  GODOT_DIR_VERSION: 4.5.1.stable

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot + export templates (official godot-builds releases)
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"
          curl -fL --retry 3 -o godot.zip "$base/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_DIR_VERSION}
          ls ~/.local/share/godot/export_templates/${GODOT_DIR_VERSION} | head

      - name: Install Android SDK components
        run: |
          set +e
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" 2>&1
          (yes | "$SM" --licenses) > /tmp/lic.log 2>&1; tail -3 /tmp/lic.log
          set -e
          "$SM" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709" 2>&1 | tee -a /tmp/sdk.log

      - name: Restore stable CI signing keystore + Godot editor settings
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$HOME/smb1r-ci.keystore"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/smb1r-ci.keystore"
          export/android/debug_keystore_user = "smb1r-ci"
          export/android/debug_keystore_pass = "${ANDROID_KEYSTORE_PASSWORD}"
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Align Android build template version with Godot
        run: |
          echo -n "${GODOT_DIR_VERSION}" > android/.build_version
          # libs/ (godot-lib.aar) is gitignored: restore it from the official template without overwriting project files
          unzip -n -q ~/.local/share/godot/export_templates/${GODOT_DIR_VERSION}/android_source.zip -d android/build
          ls -R android/build/libs | head -20
          chmod +x android/build/gradlew

      - name: Import project
        run: godot --headless --editor --path . --quit 2>&1 | tee /tmp/import.log || true

      - name: Export debug APK
        run: |
          mkdir -p build
          # Keep every later CI APK upgradeable: same signing key + increasing versionCode.
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          sed -i -E "s#^version/code=.*#version/code=${VERSION_CODE}#" export_presets.cfg
          echo "Using versionCode ${VERSION_CODE}"
          godot --headless --verbose --path . --export-debug "Android" "$PWD/build/SMB1R-Arabic-debug.apk" 2>&1 | tee /tmp/export.log
          ls -lh build

      - name: Publish diagnostics to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/diag && cp /tmp/*.log /tmp/diag/ 2>/dev/null || true
          cp ~/.config/godot/*.tres /tmp/diag/ 2>/dev/null || true
          cd /tmp/diag && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "logs run ${{ github.run_id }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs || true

      - uses: actions/upload-artifact@v4
        with:
          name: SMB1R-Arabic-android-debug-apk
          path: build/SMB1R-Arabic-debug.apk
          if-no-files-found: error
