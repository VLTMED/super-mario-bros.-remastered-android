name: Arabic localization Android APK export
on:
  push:
    branches:
      - feat/arabic-rtl-localization
  workflow_dispatch:
jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/meldanor/godot-ci:4.4-stable-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Godot templates
        env:
          GODOT_VERSION: 4.4.stable
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sf /root/.local/share/godot/export_templates/${GODOT_VERSION} ~/.local/share/godot/export_templates/${GODOT_VERSION}
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-release "Android" build/android/SuperMarioBrosRemastered-ar.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioBrosRemastered-ar-android-apk
          path: build/android/SuperMarioBrosRemastered-ar.apk
