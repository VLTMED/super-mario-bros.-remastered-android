name: Arabic localization Android APK export
on:
  push:
    branches:
      - feat/arabic-rtl-localization
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Export Arabic Android APK (debug build, for testing)
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          export_debug: true
          use_preset_export_path: true
          cache: true

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioBrosRemastered-ar-android-apk
          path: smb1r-android-arm64-9.apk
          if-no-files-found: error
