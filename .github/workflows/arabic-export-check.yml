name: Arabic localization Android APK export
on:
  push:
    branches:
      - feat/arabic-rtl-localization
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Arabic Android APK (debug build, for testing)
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.5.1/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.5.1/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          use_preset_export_path: true
          cache: true

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioBrosRemastered-ar-android-apk
          path: smb1r-android-arm64-9.apk
          if-no-files-found: error
